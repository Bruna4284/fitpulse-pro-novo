<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPulse Pro - Personal Trainer App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .pulse-timer {
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(16, 185, 129, 0.4); }
            50% { border-color: rgba(16, 185, 129, 1); }
        }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">

    <div id="app" class="flex flex-col h-full max-w-md mx-auto w-full bg-slate-900 border-x border-slate-800 shadow-2xl relative overflow-hidden">
        
        <!-- Header -->
        <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 p-3.5 sticky top-0 z-30 flex flex-col space-y-2.5">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                        <svg class="w-5 h-5 text-slate-950 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-black text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">FitPulse Pro</h1>
                        <p class="text-[10px] text-emerald-400 font-semibold tracking-wider uppercase">Plataforma do Personal</p>
                    </div>
                </div>

                <!-- Quick Action Buttons -->
                <div class="flex items-center space-x-1.5">
                    <button onclick="openStudentModal()" class="flex items-center space-x-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg transition border border-slate-700">
                        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                        <span class="text-[11px] font-medium">+ Aluno</span>
                    </button>
                    <button onclick="openExerciseModal()" class="flex items-center space-x-1 text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 px-2.5 py-1.5 rounded-lg transition font-medium">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        <span class="text-[11px]">+ Exercício</span>
                    </button>
                </div>
            </div>

            <!-- Student Active Selector Banner -->
            <div class="bg-slate-950/80 rounded-xl p-2 border border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center space-x-2 min-w-0">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></div>
                    <span class="text-[11px] font-semibold text-slate-400 shrink-0">Aluno Ativo:</span>
                    <select id="active-student-select" onchange="changeActiveStudent(this.value)" class="bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-slate-100 px-2 py-1 focus:outline-none focus:border-emerald-500 truncate cursor-pointer w-full">
                        <!-- Options generated dynamically -->
                    </select>
                </div>
            </div>
        </header>

        <!-- Main Dynamic View Area -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
            <!-- Dynamic Content via JS -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bg-slate-900/95 backdrop-blur-md border-t border-slate-800 fixed bottom-0 max-w-md w-full z-30 flex justify-between px-2 py-1.5">
            <button onclick="switchTab('workouts')" id="tab-workouts" class="flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl transition text-emerald-400 font-semibold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span class="text-[10px] mt-1 font-medium">Treinos</span>
            </button>
            <button onclick="switchTab('exercises')" id="tab-exercises" class="flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl transition text-slate-400 hover:text-slate-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-[10px] mt-1 font-medium">Exercícios</span>
            </button>
            <button onclick="switchTab('students')" id="tab-students" class="flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl transition text-slate-400 hover:text-slate-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span class="text-[10px] mt-1 font-medium">Alunos</span>
            </button>
            <button onclick="switchTab('metrics')" id="tab-metrics" class="flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl transition text-slate-400 hover:text-slate-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span class="text-[10px] mt-1 font-medium">Evolução</span>
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl transition text-slate-400 hover:text-slate-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-[10px] mt-1 font-medium">Histórico</span>
            </button>
        </nav>
    </div>

    <!-- MODAL: ADD / EDIT STUDENT -->
    <div id="student-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 id="student-modal-title" class="font-bold text-slate-100 flex items-center gap-2 text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                    <span>Novo Aluno</span>
                </h3>
                <button onclick="closeStudentModal()" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <form id="student-form" onsubmit="saveStudent(event)" class="p-4 overflow-y-auto space-y-3.5 text-xs">
                <input type="hidden" id="student-id">
                
                <div>
                    <label class="block font-semibold text-slate-400 mb-1">Nome Completo *</label>
                    <input type="text" id="student-name" required placeholder="Ex: João Silva" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-400 mb-1">Telefone / WhatsApp</label>
                        <input type="text" id="student-phone" placeholder="(11) 99999-9999" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-400 mb-1">Objetivo</label>
                        <select id="student-goal" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                            <option value="Hipertrofia">Hipertrofia</option>
                            <option value="Emagrecimento">Emagrecimento</option>
                            <option value="Condicionamento">Condicionamento</option>
                            <option value="Reabilitação">Reabilitação</option>
                            <option value="Força Maxima">Força Máxima</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-400 mb-1">Peso Inicial (kg)</label>
                        <input type="number" step="0.1" id="student-weight" placeholder="75.5" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-400 mb-1">Status Plano</label>
                        <select id="student-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                            <option value="Ativo">Ativo</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Inativo">Inativo</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-400 mb-1">Observações de Saúde / Lesões</label>
                    <textarea id="student-notes" rows="2" placeholder="Ex: Hérnia de disco L4-L5, evitar agachamento pesado..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition text-xs"></textarea>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeStudentModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl transition font-medium">Cancelar</button>
                    <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20">Salvar Aluno</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: ADD / EDIT EXERCISE -->
    <div id="exercise-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 id="modal-title" class="font-bold text-slate-100 flex items-center gap-2 text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                    <span>Novo Exercício</span>
                </h3>
                <button onclick="closeExerciseModal()" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <form id="exercise-form" onsubmit="saveExercise(event)" class="p-4 overflow-y-auto space-y-3.5 text-xs">
                <input type="hidden" id="ex-id">
                
                <div>
                    <label class="block font-semibold text-slate-400 mb-1">Nome do Exercício *</label>
                    <input type="text" id="ex-name" required placeholder="Ex: Supino Reto com Barra" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-400 mb-1">Grupo Muscular</label>
                        <select id="ex-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                            <option value="Peito">Peito</option>
                            <option value="Costas">Costas</option>
                            <option value="Pernas">Pernas</option>
                            <option value="Ombros">Ombros</option>
                            <option value="Bíceps">Bíceps</option>
                            <option value="Tríceps">Tríceps</option>
                            <option value="Abdômen">Abdômen</option>
                            <option value="Cardio">Cardio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-400 mb-1">Séries Padrão</label>
                        <input type="number" id="ex-sets" value="3" min="1" max="10" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>

                <!-- YouTube Link Input Section -->
                <div class="bg-red-950/20 border border-red-900/30 rounded-xl p-3 space-y-2">
                    <label class="block font-semibold text-red-400 flex items-center justify-between">
                        <span class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 fill-current text-red-500" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                            Link do Vídeo do YouTube
                        </span>
                        <span class="text-[10px] text-slate-400 font-normal">Opcional</span>
                    </label>
                    <input type="url" id="ex-youtube" oninput="previewYouTubeInput()" placeholder="https://www.youtube.com/watch?v=..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-red-500 transition">
                    
                    <div id="modal-yt-preview" class="hidden mt-2 relative rounded-lg overflow-hidden border border-slate-800 aspect-video bg-slate-950 flex items-center justify-center">
                        <img id="modal-yt-thumb" src="" class="w-full h-full object-cover" alt="Prévia">
                        <div class="absolute inset-0 bg-slate-950/40 flex items-center justify-center">
                            <span class="bg-red-600 text-white rounded-full p-2 shadow-lg">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-400 mb-1">Dicas de Execução / Observações</label>
                    <textarea id="ex-notes" rows="2" placeholder="Ex: Escápulas aduzidas, cotovelos em 45 graus..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition text-xs"></textarea>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeExerciseModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl transition font-medium">Cancelar</button>
                    <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20">Salvar Exercício</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: ADD / EDIT WORKOUT ROUTINE -->
    <div id="routine-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 id="routine-modal-title" class="font-bold text-slate-100 flex items-center gap-2 text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    <span>Nova Ficha de Treino</span>
                </h3>
                <button onclick="closeRoutineModal()" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <form id="routine-form" onsubmit="saveRoutine(event)" class="p-4 overflow-y-auto space-y-3.5 text-xs">
                <input type="hidden" id="routine-id">
                
                <div>
                    <label class="block font-semibold text-slate-400 mb-1">Título do Treino *</label>
                    <input type="text" id="routine-title" required placeholder="Ex: Treino A - Peito & Tríceps" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div>
                    <label class="block font-semibold text-slate-400 mb-1">Descrição / Foco</label>
                    <input type="text" id="routine-desc" placeholder="Ex: Foco em força e hipertrofia" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div>
                    <label class="block font-semibold text-slate-400 mb-1">Selecione os Exercícios do Treino</label>
                    <div id="routine-exercise-checkboxes" class="space-y-1.5 max-h-48 overflow-y-auto border border-slate-800 rounded-xl p-2.5 bg-slate-950">
                        <!-- Checkboxes populated via JS -->
                    </div>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeRoutineModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl transition font-medium">Cancelar</button>
                    <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20">Salvar Ficha</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: YOUTUBE VIDEO PLAYER -->
    <div id="video-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col">
            <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                <div class="flex items-center space-x-2 truncate">
                    <svg class="w-5 h-5 text-red-500 shrink-0 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    <h3 id="video-modal-title" class="font-bold text-xs text-slate-100 truncate">Execução do Exercício</h3>
                </div>
                <button onclick="closeVideoModal()" class="text-slate-400 hover:text-slate-100 p-1.5 rounded-lg bg-slate-800/50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="relative w-full aspect-video bg-black">
                <iframe id="youtube-iframe" class="w-full h-full" src="" title="Vídeo do YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-modal-notes" class="p-3 bg-slate-900 text-xs text-slate-400 border-t border-slate-800">
                <!-- Notes dynamically inserted -->
            </div>
        </div>
    </div>

    <!-- MODAL: ADD BODY METRICS -->
    <div id="metrics-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 class="font-bold text-slate-100 flex items-center gap-2 text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    <span>Nova Avaliação Física</span>
                </h3>
                <button onclick="closeMetricsModal()" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <form id="metrics-form" onsubmit="saveMetrics(event)" class="p-4 space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-400 mb-1">Peso Corporal (kg) *</label>
                    <input type="number" step="0.1" id="m-weight" required placeholder="78.2" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-400 mb-1">% de Gordura (BF)</label>
                        <input type="number" step="0.1" id="m-bf" placeholder="15.4" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-400 mb-1">Cintura (cm)</label>
                        <input type="number" step="0.5" id="m-waist" placeholder="82" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeMetricsModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl transition font-medium">Cancelar</button>
                    <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20">Registrar Medidas</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ACTIVE WORKOUT FULLSCREEN OVERLAY -->
    <div id="active-workout-overlay" class="fixed inset-0 bg-slate-950 z-50 flex flex-col hidden overflow-hidden">
        <!-- Active Workout Header -->
        <div class="bg-slate-900 border-b border-slate-800 p-3.5 flex justify-between items-center">
            <div>
                <span class="text-[10px] font-bold text-emerald-400 tracking-wider uppercase">Treino Em Andamento</span>
                <h2 id="active-workout-title" class="font-extrabold text-slate-100 text-base">Treino A - Peito</h2>
            </div>
            <button onclick="finishWorkoutSession()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-bold px-3 py-2 rounded-xl transition shadow-lg shadow-emerald-500/20">
                Finalizar
            </button>
        </div>

        <!-- Timer Bar -->
        <div class="bg-slate-900/80 border-b border-slate-800/80 px-4 py-2 flex items-center justify-between text-xs">
            <div class="flex items-center space-x-2">
                <span class="text-slate-400">Duração:</span>
                <span id="session-timer-text" class="font-mono font-bold text-slate-200">00:00</span>
            </div>

            <!-- Rest Timer Widget -->
            <div id="rest-timer-widget" class="flex items-center space-x-2 bg-slate-950 px-3 py-1 rounded-full border border-slate-800">
                <span class="text-slate-400 text-[11px]">Descanso:</span>
                <span id="rest-timer-seconds" class="font-mono font-bold text-emerald-400">00s</span>
                <button onclick="startRestTimer(60)" class="text-[10px] text-emerald-400 hover:text-emerald-300 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/30">+60s</button>
            </div>
        </div>

        <!-- Exercise List in Active Session -->
        <div id="active-workout-exercises-container" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Dynamically populated execution cards -->
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-800 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2">
        <span id="toast-icon" class="text-emerald-400">✓</span>
        <span id="toast-msg">Mensagem</span>
    </div>

    <script>
        // Initial Mock Database
        const defaultStudents = [
            { id: 'st-1', name: 'João Silva', phone: '(11) 98765-4321', goal: 'Hipertrofia', status: 'Ativo', weight: 82.5, notes: 'Atenção aos joelhos no agachamento.' },
            { id: 'st-2', name: 'Maria Oliveira', phone: '(21) 99887-7665', goal: 'Emagrecimento', status: 'Ativo', weight: 64.0, notes: 'Ligeiro desconforto no ombro esquerdo.' }
        ];

        const defaultExercises = [
            {
                id: 'ex-1',
                name: 'Supino Reto com Barra',
                category: 'Peito',
                youtubeUrl: 'https://www.youtube.com/watch?v=rT7DgCr-3pg',
                youtubeId: 'rT7DgCr-3pg',
                sets: 4,
                notes: 'Mantenha os pés firmes no chão e contraia o abdômen durante toda a execução.'
            },
            {
                id: 'ex-2',
                name: 'Puxada Frontal no Pulley',
                category: 'Costas',
                youtubeUrl: 'https://www.youtube.com/watch?v=CAwf7n6Luuc',
                youtubeId: 'CAwf7n6Luuc',
                sets: 4,
                notes: 'Puxe a barra até a altura do peito, focando no esmagamento das dorsais.'
            },
            {
                id: 'ex-3',
                name: 'Agachamento Livre',
                category: 'Pernas',
                youtubeUrl: 'https://www.youtube.com/watch?v=ultWZbUMPL8',
                youtubeId: 'ultWZbUMPL8',
                sets: 4,
                notes: 'Joelhos acompanhando a ponta dos pés. Desça mantendo a curvatura natural da coluna.'
            },
            {
                id: 'ex-4',
                name: 'Desenvolvimento com Halteres',
                category: 'Ombros',
                youtubeUrl: 'https://www.youtube.com/watch?v=TLvK2UExsD8',
                youtubeId: 'TLvK2UExsD8',
                sets: 3,
                notes: 'Mantenha o tronco estável e evite hiperextender a coluna lombar.'
            }
        ];

        const defaultWorkouts = [
            {
                id: 'w-1',
                studentId: 'st-1',
                title: 'Treino A - Peito & Ombro',
                description: 'Força e Hipertrofia Músculos Anteriores',
                exerciseIds: ['ex-1', 'ex-4']
            },
            {
                id: 'w-2',
                studentId: 'st-1',
                title: 'Treino B - Costas & Pernas',
                description: 'Cadeia Posterior e Inferiores',
                exerciseIds: ['ex-2', 'ex-3']
            }
        ];

        const defaultMetrics = [
            { id: 'm-1', studentId: 'st-1', date: '01/09/2026', weight: 83.5, bf: 16.0, waist: 84 },
            { id: 'm-2', studentId: 'st-1', date: '20/09/2026', weight: 82.5, bf: 15.2, waist: 82.5 }
        ];

        // State Management
        let students = JSON.parse(localStorage.getItem('fitpulse_students')) || defaultStudents;
        let exercises = JSON.parse(localStorage.getItem('fitpulse_exercises')) || defaultExercises;
        let workouts = JSON.parse(localStorage.getItem('fitpulse_workouts')) || defaultWorkouts;
        let historyLogs = JSON.parse(localStorage.getItem('fitpulse_history')) || [];
        let metricsLogs = JSON.parse(localStorage.getItem('fitpulse_metrics')) || defaultMetrics;
        
        let activeStudentId = localStorage.getItem('fitpulse_active_student') || (students[0] ? students[0].id : '');
        let currentTab = 'workouts';

        // Session Execution State
        let activeSession = null;
        let sessionTimerInterval = null;
        let sessionSeconds = 0;
        let restTimerInterval = null;
        let restSeconds = 0;

        function parseYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.trim().match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function saveToStorage() {
            localStorage.setItem('fitpulse_students', JSON.stringify(students));
            localStorage.setItem('fitpulse_exercises', JSON.stringify(exercises));
            localStorage.setItem('fitpulse_workouts', JSON.stringify(workouts));
            localStorage.setItem('fitpulse_history', JSON.stringify(historyLogs));
            localStorage.setItem('fitpulse_metrics', JSON.stringify(metricsLogs));
            localStorage.setItem('fitpulse_active_student', activeStudentId);
        }

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMsg.innerText = msg;
            toastIcon.innerText = isSuccess ? '✓' : 'ℹ';
            toastIcon.className = isSuccess ? 'text-emerald-400 font-bold' : 'text-blue-400 font-bold';

            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
            }, 3000);
        }

        function populateStudentSelector() {
            const select = document.getElementById('active-student-select');
            select.innerHTML = '';

            if (students.length === 0) {
                select.innerHTML = `<option value="">Nenhum Aluno Cadastrado</option>`;
                return;
            }

            students.forEach(s => {
                const option = document.createElement('option');
                option.value = s.id;
                option.textContent = `${s.name} (${s.goal || 'Aluno'})`;
                if (s.id === activeStudentId) option.selected = true;
                select.appendChild(option);
            });
        }

        function changeActiveStudent(studentId) {
            activeStudentId = studentId;
            saveToStorage();
            renderMainContent();
            showToast(`Aluno alterado com sucesso!`);
        }

        function switchTab(tab) {
            currentTab = tab;
            ['workouts', 'exercises', 'students', 'metrics', 'history'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl transition text-emerald-400 font-semibold";
                } else {
                    btn.className = "flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl transition text-slate-400 hover:text-slate-200";
                }
            });

            renderMainContent();
        }

        function renderMainContent() {
            populateStudentSelector();
            const container = document.getElementById('main-content');
            
            if (currentTab === 'workouts') {
                renderWorkoutsTab(container);
            } else if (currentTab === 'exercises') {
                renderExercisesTab(container);
            } else if (currentTab === 'students') {
                renderStudentsTab(container);
            } else if (currentTab === 'metrics') {
                renderMetricsTab(container);
            } else if (currentTab === 'history') {
                renderHistoryTab(container);
            }
        }

        // --- TAB 1: WORKOUTS ---
        function renderWorkoutsTab(container) {
            const activeStudent = students.find(s => s.id === activeStudentId);
            const studentWorkouts = workouts.filter(w => !w.studentId || w.studentId === activeStudentId);

            let html = `
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <h2 class="font-bold text-slate-100 text-sm">Fichas de Treino</h2>
                        <p class="text-[11px] text-slate-400">Exibindo fichas de: <strong class="text-emerald-400">${activeStudent ? activeStudent.name : 'Geral'}</strong></p>
                    </div>
                    <button onclick="openRoutineModal()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded-xl font-bold transition">
                        + Nova Ficha
                    </button>
                </div>
            `;

            if (studentWorkouts.length === 0) {
                html += `
                    <div class="text-center py-10 border border-dashed border-slate-800 rounded-2xl p-6">
                        <svg class="w-10 h-10 text-slate-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                        <p class="text-slate-300 font-medium text-xs">Nenhuma ficha criada para este aluno</p>
                        <button onclick="openRoutineModal()" class="mt-3 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold">Criar Primeira Ficha</button>
                    </div>
                `;
            } else {
                html += `<div class="space-y-3">`;
                studentWorkouts.forEach(w => {
                    const workoutExercises = exercises.filter(e => w.exerciseIds && w.exerciseIds.includes(e.id));
                    
                    html += `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-md space-y-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-slate-100 text-sm">${w.title}</h3>
                                    <p class="text-xs text-slate-400 mt-0.5">${w.description || 'Sem descrição'}</p>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button onclick="deleteRoutine('${w.id}')" class="text-slate-500 hover:text-red-400 p-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </div>

                            <div class="space-y-1.5">
                                ${workoutExercises.map(ex => `
                                    <div class="flex items-center justify-between bg-slate-950/60 p-2 rounded-xl border border-slate-800/80 text-xs">
                                        <div class="flex items-center space-x-2 min-w-0">
                                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0"></span>
                                            <span class="font-medium text-slate-200 truncate">${ex.name}</span>
                                        </div>
                                        <div class="flex items-center space-x-2 shrink-0">
                                            ${ex.youtubeId ? `
                                                <button onclick="playVideo('${ex.id}')" class="text-red-400 hover:text-red-300 p-1 bg-red-950/40 rounded-md border border-red-900/30 flex items-center gap-1 text-[10px] font-medium">
                                                    <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                    Vídeo
                                                </button>
                                            ` : ''}
                                            <span class="text-[11px] text-slate-400">${ex.sets || 3}x</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <button onclick="startWorkoutSession('${w.id}')" class="w-full mt-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-extrabold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/10 flex items-center justify-center space-x-2">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                <span>Iniciar Treino Agora</span>
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // --- TAB 2: EXERCISES ---
        function renderExercisesTab(container) {
            let html = `
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <h2 class="font-bold text-slate-100 text-sm">Biblioteca de Exercícios</h2>
                        <p class="text-[11px] text-slate-400">${exercises.length} exercícios cadastrados</p>
                    </div>
                </div>
            `;

            if (exercises.length === 0) {
                html += `
                    <div class="text-center py-12 border border-dashed border-slate-800 rounded-2xl p-6">
                        <p class="text-slate-300 font-medium text-xs">Nenhum exercício cadastrado</p>
                        <button onclick="openExerciseModal()" class="mt-3 bg-emerald-500 text-slate-950 px-3 py-1.5 rounded-xl font-bold text-xs">Adicionar Exercício</button>
                    </div>
                `;
            } else {
                html += `<div class="space-y-3">`;
                exercises.forEach(ex => {
                    const hasVideo = !!ex.youtubeId;
                    const thumbUrl = hasVideo ? `https://img.youtube.com/vi/${ex.youtubeId}/hqdefault.jpg` : null;

                    html += `
                        <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-3 shadow-md flex flex-col space-y-2.5 transition">
                            <div class="flex gap-3 items-start">
                                ${hasVideo ? `
                                    <div onclick="playVideo('${ex.id}')" class="relative w-24 aspect-video rounded-xl overflow-hidden bg-slate-950 shrink-0 cursor-pointer group border border-slate-800">
                                        <img src="${thumbUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${ex.name}">
                                        <div class="absolute inset-0 bg-slate-950/40 group-hover:bg-slate-950/20 transition flex items-center justify-center">
                                            <span class="bg-red-600 text-white rounded-full p-1.5 shadow-lg group-hover:scale-110 transition">
                                                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                            </span>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center shrink-0 text-slate-400">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                    </div>
                                `}

                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between">
                                        <span class="text-[9px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">${ex.category || 'Geral'}</span>
                                        <div class="flex items-center space-x-1">
                                            <button onclick="editExercise('${ex.id}')" class="text-slate-400 hover:text-slate-200 p-1">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                            </button>
                                            <button onclick="deleteExercise('${ex.id}')" class="text-slate-400 hover:text-red-400 p-1">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <h3 class="font-bold text-slate-100 text-xs mt-1 truncate">${ex.name}</h3>
                                    <p class="text-[11px] text-slate-400 mt-0.5">${ex.sets || 3} Séries sugeridas</p>
                                </div>
                            </div>

                            ${ex.notes ? `
                                <div class="bg-slate-950/50 rounded-xl p-2 text-[11px] text-slate-400 border border-slate-800 flex items-start space-x-1.5">
                                    <span class="text-slate-500 font-bold">💡</span>
                                    <p class="leading-relaxed">${ex.notes}</p>
                                </div>
                            ` : ''}

                            ${hasVideo ? `
                                <button onclick="playVideo('${ex.id}')" class="w-full py-1 px-3 bg-red-950/30 hover:bg-red-950/50 border border-red-900/40 text-red-400 rounded-xl text-[11px] font-semibold flex items-center justify-center space-x-1.5 transition">
                                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                                    <span>Assistir Execução no YouTube</span>
                                </button>
                            ` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // --- TAB 3: STUDENTS ---
        function renderStudentsTab(container) {
            let html = `
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <h2 class="font-bold text-slate-100 text-sm">Meus Alunos Cadastrados</h2>
                        <p class="text-[11px] text-slate-400">${students.length} alunos sob sua consultoria</p>
                    </div>
                    <button onclick="openStudentModal()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded-xl font-bold transition">
                        + Cadastrar
                    </button>
                </div>
            `;

            if (students.length === 0) {
                html += `
                    <div class="text-center py-12 border border-dashed border-slate-800 rounded-2xl p-6">
                        <p class="text-slate-300 font-medium text-xs">Nenhum aluno cadastrado ainda</p>
                    </div>
                `;
            } else {
                html += `<div class="space-y-3">`;
                students.forEach(s => {
                    const isCurrent = s.id === activeStudentId;
                    html += `
                        <div class="bg-slate-900 border ${isCurrent ? 'border-emerald-500/80 bg-emerald-950/10' : 'border-slate-800'} rounded-2xl p-3.5 shadow-md space-y-2">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center space-x-2">
                                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center font-bold text-xs text-emerald-400 border border-slate-700">
                                        ${s.name.substring(0,2).toUpperCase()}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-slate-100 text-xs">${s.name} ${isCurrent ? '<span class="text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded ml-1 font-bold">SELECIONADO</span>' : ''}</h3>
                                        <p class="text-[10px] text-slate-400">${s.phone || 'Sem telefone'} • ${s.goal || 'Geral'}</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button onclick="editStudent('${s.id}')" class="text-slate-400 hover:text-slate-200 p-1">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    </button>
                                </div>
                            </div>

                            ${s.notes ? `
                                <div class="bg-slate-950/60 rounded-xl p-2 text-[10px] text-amber-300/80 border border-amber-900/30">
                                    ⚠️ Restrições/Lesões: ${s.notes}
                                </div>
                            ` : ''}

                            <div class="pt-1 flex gap-2">
                                ${!isCurrent ? `
                                    <button onclick="changeActiveStudent('${s.id}')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold py-1.5 rounded-lg border border-slate-700">
                                        Ativar para Treinar
                                    </button>
                                ` : `
                                    <span class="flex-1 text-center text-emerald-400 text-[11px] font-bold py-1.5">
                                        Aluno Ativo no Sistema
                                    </span>
                                `}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // --- TAB 4: METRICS ---
        function renderMetricsTab(container) {
            const activeStudent = students.find(s => s.id === activeStudentId);
            const studentMetrics = metricsLogs.filter(m => m.studentId === activeStudentId);

            let html = `
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <h2 class="font-bold text-slate-100 text-sm">Evolução de Peso e Medidas</h2>
                        <p class="text-[11px] text-slate-400">Aluno: <strong class="text-emerald-400">${activeStudent ? activeStudent.name : 'Selecione'}</strong></p>
                    </div>
                    <button onclick="openMetricsModal()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded-xl font-bold transition">
                        + Medidas
                    </button>
                </div>
            `;

            if (studentMetrics.length === 0) {
                html += `
                    <div class="text-center py-10 border border-dashed border-slate-800 rounded-2xl p-6">
                        <p class="text-slate-400 text-xs">Nenhum registro de peso/medidas para este aluno.</p>
                        <button onclick="openMetricsModal()" class="mt-3 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold">Registrar Primeira Avaliação</button>
                    </div>
                `;
            } else {
                html += `<div class="space-y-3">`;
                studentMetrics.slice().reverse().forEach(m => {
                    html += `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                            <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
                                <span class="font-bold text-xs text-slate-200">Data: ${m.date}</span>
                                <span class="text-emerald-400 font-extrabold text-sm">${m.weight} kg</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-400">
                                <div>Gordura Corpora (BF): <strong class="text-slate-200">${m.bf ? m.bf + '%' : '--'}</strong></div>
                                <div>Cintura: <strong class="text-slate-200">${m.waist ? m.waist + ' cm' : '--'}</strong></div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // --- TAB 5: HISTORY ---
        function renderHistoryTab(container) {
            const activeStudent = students.find(s => s.id === activeStudentId);
            const logs = historyLogs.filter(h => !h.studentId || h.studentId === activeStudentId);

            let html = `
                <div class="mb-2">
                    <h2 class="font-bold text-slate-100 text-sm">Histórico de Treinos Finalizados</h2>
                    <p class="text-[11px] text-slate-400">Aluno: <strong class="text-emerald-400">${activeStudent ? activeStudent.name : 'Todos'}</strong></p>
                </div>
            `;

            if (logs.length === 0) {
                html += `
                    <div class="text-center py-10 border border-dashed border-slate-800 rounded-2xl p-6">
                        <p class="text-slate-400 text-xs">Nenhum treino concluído ainda para este aluno.</p>
                    </div>
                `;
            } else {
                html += `<div class="space-y-2.5">`;
                logs.slice().reverse().forEach(log => {
                    html += `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-xs text-slate-200">${log.title}</h4>
                                <p class="text-[10px] text-slate-400">${log.date} • Duração: ${log.duration}</p>
                            </div>
                            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[9px] font-bold px-2 py-0.5 rounded-md">Concluído</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // --- STUDENT MODAL LOGIC ---
        function openStudentModal(id = null) {
            document.getElementById('student-form').reset();
            document.getElementById('student-id').value = '';
            
            if (id) {
                const s = students.find(st => st.id === id);
                if (s) {
                    document.getElementById('student-id').value = s.id;
                    document.getElementById('student-name').value = s.name;
                    document.getElementById('student-phone').value = s.phone || '';
                    document.getElementById('student-goal').value = s.goal || 'Hipertrofia';
                    document.getElementById('student-weight').value = s.weight || '';
                    document.getElementById('student-notes').value = s.notes || '';
                }
            }

            document.getElementById('student-modal').classList.remove('hidden');
        }

        function closeStudentModal() {
            document.getElementById('student-modal').classList.add('hidden');
        }

        function saveStudent(e) {
            e.preventDefault();
            const id = document.getElementById('student-id').value;
            const name = document.getElementById('student-name').value.trim();
            const phone = document.getElementById('student-phone').value.trim();
            const goal = document.getElementById('student-goal').value;
            const weight = parseFloat(document.getElementById('student-weight').value) || 0;
            const notes = document.getElementById('student-notes').value.trim();

            if (!name) return;

            if (id) {
                const index = students.findIndex(s => s.id === id);
                if (index !== -1) {
                    students[index] = { ...students[index], name, phone, goal, weight, notes };
                    showToast('Aluno atualizado com sucesso!');
                }
            } else {
                const newStudent = {
                    id: 'st-' + Date.now(),
                    name,
                    phone,
                    goal,
                    status: 'Ativo',
                    weight,
                    notes
                };
                students.push(newStudent);
                activeStudentId = newStudent.id;
                showToast('Aluno cadastrado e selecionado!');
            }

            saveToStorage();
            closeStudentModal();
            renderMainContent();
        }

        function editStudent(id) {
            openStudentModal(id);
        }

        // --- EXERCISE MODAL LOGIC ---
        function openExerciseModal(editId = null) {
            document.getElementById('exercise-form').reset();
            document.getElementById('ex-id').value = '';
            document.getElementById('modal-yt-preview').classList.add('hidden');

            if (editId) {
                const ex = exercises.find(e => e.id === editId);
                if (ex) {
                    document.getElementById('ex-id').value = ex.id;
                    document.getElementById('ex-name').value = ex.name;
                    document.getElementById('ex-category').value = ex.category || 'Peito';
                    document.getElementById('ex-sets').value = ex.sets || 3;
                    document.getElementById('ex-youtube').value = ex.youtubeUrl || '';
                    document.getElementById('ex-notes').value = ex.notes || '';
                    previewYouTubeInput();
                }
            }

            document.getElementById('exercise-modal').classList.remove('hidden');
        }

        function closeExerciseModal() {
            document.getElementById('exercise-modal').classList.add('hidden');
        }

        function previewYouTubeInput() {
            const url = document.getElementById('ex-youtube').value;
            const ytId = parseYouTubeId(url);
            const previewContainer = document.getElementById('modal-yt-preview');
            const previewThumb = document.getElementById('modal-yt-thumb');

            if (ytId) {
                previewThumb.src = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                previewContainer.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
            }
        }

        function saveExercise(e) {
            e.preventDefault();
            const id = document.getElementById('ex-id').value;
            const name = document.getElementById('ex-name').value.trim();
            const category = document.getElementById('ex-category').value;
            const sets = parseInt(document.getElementById('ex-sets').value) || 3;
            const youtubeUrl = document.getElementById('ex-youtube').value.trim();
            const notes = document.getElementById('ex-notes').value.trim();
            const youtubeId = parseYouTubeId(youtubeUrl);

            if (!name) return;

            if (id) {
                const index = exercises.findIndex(ex => ex.id === id);
                if (index !== -1) {
                    exercises[index] = { ...exercises[index], name, category, sets, youtubeUrl, youtubeId, notes };
                    showToast('Exercício atualizado!');
                }
            } else {
                const newEx = {
                    id: 'ex-' + Date.now(),
                    name,
                    category,
                    sets,
                    youtubeUrl,
                    youtubeId,
                    notes
                };
                exercises.push(newEx);
                showToast('Exercício adicionado à biblioteca!');
            }

            saveToStorage();
            closeExerciseModal();
            renderMainContent();
        }

        function editExercise(id) {
            openExerciseModal(id);
        }

        function deleteExercise(id) {
            exercises = exercises.filter(e => e.id !== id);
            workouts.forEach(w => {
                if (w.exerciseIds) {
                    w.exerciseIds = w.exerciseIds.filter(exId => exId !== id);
                }
            });
            saveToStorage();
            renderMainContent();
            showToast('Exercício removido!');
        }

        // --- ROUTINE MODAL LOGIC ---
        function openRoutineModal() {
            document.getElementById('routine-form').reset();
            document.getElementById('routine-id').value = '';

            const container = document.getElementById('routine-exercise-checkboxes');
            container.innerHTML = '';

            exercises.forEach(ex => {
                const div = document.createElement('div');
                div.className = 'flex items-center space-x-2 py-1 border-b border-slate-900/60 text-xs';
                div.innerHTML = `
                    <input type="checkbox" id="routine-ex-${ex.id}" value="${ex.id}" class="rounded border-slate-700 text-emerald-500 focus:ring-emerald-500 bg-slate-900">
                    <label for="routine-ex-${ex.id}" class="text-slate-200 cursor-pointer flex-1 truncate">${ex.name} (${ex.category})</label>
                `;
                container.appendChild(div);
            });

            document.getElementById('routine-modal').classList.remove('hidden');
        }

        function closeRoutineModal() {
            document.getElementById('routine-modal').classList.add('hidden');
        }

        function saveRoutine(e) {
            e.preventDefault();
            const title = document.getElementById('routine-title').value.trim();
            const description = document.getElementById('routine-desc').value.trim();
            
            const selectedEx = [];
            exercises.forEach(ex => {
                const chk = document.getElementById(`routine-ex-${ex.id}`);
                if (chk && chk.checked) selectedEx.push(ex.id);
            });

            if (!title) return;

            const newRoutine = {
                id: 'w-' + Date.now(),
                studentId: activeStudentId,
                title,
                description,
                exerciseIds: selectedEx
            };

            workouts.push(newRoutine);
            saveToStorage();
            closeRoutineModal();
            renderMainContent();
            showToast('Ficha de treino criada com sucesso!');
        }

        function deleteRoutine(id) {
            workouts = workouts.filter(w => w.id !== id);
            saveToStorage();
            renderMainContent();
            showToast('Ficha de treino removida!');
        }

        // --- YOUTUBE VIDEO MODAL ---
        function playVideo(exerciseId) {
            const ex = exercises.find(e => e.id === exerciseId);
            if (!ex || !ex.youtubeId) return;

            const videoModal = document.getElementById('video-modal');
            const iframe = document.getElementById('youtube-iframe');
            const title = document.getElementById('video-modal-title');
            const notes = document.getElementById('video-modal-notes');

            title.innerText = ex.name;
            iframe.src = `https://www.youtube.com/embed/${ex.youtubeId}?autoplay=1`;
            
            if (ex.notes) {
                notes.innerText = `💡 Dica de Execução: ${ex.notes}`;
                notes.classList.remove('hidden');
            } else {
                notes.classList.add('hidden');
            }

            videoModal.classList.remove('hidden');
        }

        function closeVideoModal() {
            const videoModal = document.getElementById('video-modal');
            const iframe = document.getElementById('youtube-iframe');
            iframe.src = "";
            videoModal.classList.add('hidden');
        }

        // --- METRICS MODAL LOGIC ---
        function openMetricsModal() {
            document.getElementById('metrics-form').reset();
            document.getElementById('metrics-modal').classList.remove('hidden');
        }

        function closeMetricsModal() {
            document.getElementById('metrics-modal').classList.add('hidden');
        }

        function saveMetrics(e) {
            e.preventDefault();
            const weight = parseFloat(document.getElementById('m-weight').value);
            const bf = parseFloat(document.getElementById('m-bf').value) || null;
            const waist = parseFloat(document.getElementById('m-waist').value) || null;

            if (!weight) return;

            const newMetric = {
                id: 'm-' + Date.now(),
                studentId: activeStudentId,
                date: new Date().toLocaleDateString('pt-BR'),
                weight,
                bf,
                waist
            };

            metricsLogs.push(newMetric);
            
            // Update student current weight
            const studentIndex = students.findIndex(s => s.id === activeStudentId);
            if (studentIndex !== -1) {
                students[studentIndex].weight = weight;
            }

            saveToStorage();
            closeMetricsModal();
            renderMainContent();
            showToast('Medidas registradas com sucesso!');
        }

        // --- ACTIVE WORKOUT EXECUTION SESSION ---
        function startWorkoutSession(workoutId) {
            const w = workouts.find(item => item.id === workoutId);
            if (!w) return;

            const workoutExercises = exercises.filter(e => w.exerciseIds && w.exerciseIds.includes(e.id));

            activeSession = {
                workoutId: w.id,
                title: w.title,
                studentId: activeStudentId,
                startTime: Date.now(),
                exercises: workoutExercises.map(ex => ({
                    ...ex,
                    completedSets: new Array(ex.sets || 3).fill(false)
                }))
            };

            document.getElementById('active-workout-title').innerText = w.title;
            renderActiveSessionExercises();

            // Start Session Timer
            sessionSeconds = 0;
            clearInterval(sessionTimerInterval);
            sessionTimerInterval = setInterval(() => {
                sessionSeconds++;
                const mins = String(Math.floor(sessionSeconds / 60)).padStart(2, '0');
                const secs = String(sessionSeconds % 60).padStart(2, '0');
                document.getElementById('session-timer-text').innerText = `${mins}:${secs}`;
            }, 1000);

            document.getElementById('active-workout-overlay').classList.remove('hidden');
        }

        function renderActiveSessionExercises() {
            const container = document.getElementById('active-workout-exercises-container');
            container.innerHTML = '';

            activeSession.exercises.forEach((ex, exIdx) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3';
                
                let setsHtml = '';
                ex.completedSets.forEach((done, setIdx) => {
                    setsHtml += `
                        <div class="flex items-center justify-between bg-slate-950/70 p-2 rounded-xl border border-slate-800/80 text-xs">
                            <span class="font-bold text-slate-300">Série ${setIdx + 1}</span>
                            <div class="flex items-center space-x-2">
                                <input type="number" placeholder="kg" class="w-14 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center text-slate-100 font-bold focus:outline-none focus:border-emerald-500">
                                <input type="number" placeholder="reps" value="10" class="w-14 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center text-slate-100 font-bold focus:outline-none focus:border-emerald-500">
                                <button onclick="toggleSetDone(${exIdx}, ${setIdx})" class="p-1.5 rounded-lg transition ${done ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-500 hover:text-slate-300'}">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <h3 class="font-bold text-slate-100 text-xs">${ex.name}</h3>
                        </div>
                        ${ex.youtubeId ? `
                            <button onclick="playVideo('${ex.id}')" class="text-red-400 hover:text-red-300 text-[10px] bg-red-950/30 px-2 py-1 rounded-lg border border-red-900/30 font-semibold flex items-center gap-1">
                                <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                Vídeo
                            </button>
                        ` : ''}
                    </div>
                    <div class="space-y-1.5">
                        ${setsHtml}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function toggleSetDone(exIdx, setIdx) {
            activeSession.exercises[exIdx].completedSets[setIdx] = !activeSession.exercises[exIdx].completedSets[setIdx];
            renderActiveSessionExercises();
            startRestTimer(50);
        }

        function startRestTimer(seconds) {
            restSeconds = seconds;
            clearInterval(restTimerInterval);
            const textEl = document.getElementById('rest-timer-seconds');
            
            restTimerInterval = setInterval(() => {
                if (restSeconds <= 0) {
                    clearInterval(restTimerInterval);
                    textEl.innerText = "00s";
                    showToast("Descanso concluído! Próxima série!", false);
                    return;
                }
                restSeconds--;
                textEl.innerText = `${String(restSeconds).padStart(2, '0')}s`;
            }, 1000);
        }

        function finishWorkoutSession() {
            clearInterval(sessionTimerInterval);
            clearInterval(restTimerInterval);

            const durationMins = Math.max(1, Math.round(sessionSeconds / 60));
            const log = {
                id: 'log-' + Date.now(),
                studentId: activeStudentId,
                title: activeSession.title,
                date: new Date().toLocaleDateString('pt-BR'),
                duration: `${durationMins} min`
            };

            historyLogs.push(log);
            saveToStorage();

            document.getElementById('active-workout-overlay').classList.add('hidden');
            activeSession = null;

            showToast(`Parabéns! Treino finalizado e salvo no histórico!`);
            switchTab('history');
        }

        window.onload = function() {
            renderMainContent();
        };
    </script>
</body>
</html>
